<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CYVUI Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Modern Dark Roblox UI Library">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Modern Dark Theme -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  
  <style>
    :root {
      --base-font-size: 16px;
      --theme-color: #8b5cf6; /* CYVUI Violet */
      --sidebar-width: 280px;
    }
    nav.app-nav li ul { min-width: 100px; }
    .markdown-section code { border-radius: 4px; }
  </style>
</head>
<body>
  <div id="app">Loading CYVUI Docs...</div>
  <script>
    window.$docsify = {
      name: 'CYVUI',
      repo: 'https://github.com/urmoit/CYVUILibrary', // Change to your repo
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 2,
      auto2top: true,
      copyCode: {
        buttonText : 'Copy',
        errorText  : 'Error',
        successText: 'Copied'
      },
      search: {
        placeholder: 'Search documentation...',
        noData: 'No results!',
        depth: 6
      }
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-lua.min.js"></script>
</body>
</html>
