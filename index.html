<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CYVUI | Documentation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Modern Dark Theme Base -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  
  <style>
    /* --- Dashboard Color Variables --- */
    :root {
      --theme-color: #8b5cf6;       /* CYVUI Violet */
      --base-background: #0a0a0d;   /* Deep Unified Black */
      --sidebar-background: #0d0d11;
      --sidebar-width: 280px;
      
      /* Typography */
      --base-font-family: 'Inter', -apple-system, sans-serif;
      --heading-color: #ffffff;
      --text-color-base: #94a3b8;
      --code-theme-background: #111116;
    }

    /* --- Global Layout Reset --- */
    html, body {
      background-color: var(--base-background) !important;
      color: var(--text-color-base);
      margin: 0;
      padding: 0;
    }

    /* --- Fix Broken Header / Navbar --- */
    .app-nav {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      margin: 25px 40px 0 0;
    }

    .app-nav li, .app-nav ul {
      background: transparent !important;
      border: none !important;
    }

    .app-nav a {
      color: #94a3b8 !important;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s;
    }

    .app-nav a:hover {
      color: #ffffff !important;
    }

    /* --- Locked Coverpage (Non-Scrollable) --- */
    section.cover {
      height: 100vh !important;
      overflow: hidden !important;
      background-color: var(--base-background) !important;
      display: flex;
      align-items: center;
    }

    section.cover .cover-main {
      margin: 0 auto;
      max-width: 800px;
    }

    section.cover h1 {
      font-size: 4rem;
      font-weight: 800;
      letter-spacing: -2px;
      color: #ffffff;
    }

    section.cover h1 span {
      color: var(--theme-color);
    }

    /* Minimalist Dashboard Buttons */
    section.cover p a {
      border-radius: 8px !important;
      padding: 12px 32px !important;
      font-weight: 600 !important;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      background: #16161e !important;
      border: 1px solid #26262e !important;
      color: #ffffff !important;
      margin: 0 8px !important;
    }

    section.cover p a:first-of-type {
      background: #ffffff !important;
      color: #000000 !important;
      border: 1px solid #ffffff !important;
    }

    section.cover p a:hover {
      border-color: var(--theme-color) !important;
      color: var(--theme-color) !important;
      background: transparent !important;
    }

    /* --- Sidebar - Muted Dashboard Style --- */
    .sidebar {
      background-color: var(--sidebar-background) !important;
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 20px;
    }

    .sidebar-nav li > a {
      color: #64748b !important;
      font-size: 14px;
      border-left: 2px solid transparent;
      margin: 4px 0;
      transition: 0.2s;
    }

    .sidebar-nav li.active > a {
      color: #ffffff !important;
      font-weight: 600;
      border-left: 2px solid var(--theme-color);
      background: linear-gradient(90deg, rgba(139, 92, 246, 0.05) 0%, transparent 100%);
    }

    /* --- Content Area Styling --- */
    main, article#main {
      background-color: var(--base-background) !important;
    }

    .markdown-section {
      max-width: 850px;
      padding-top: 40px;
    }

    .markdown-section h1, .markdown-section h2, .markdown-section h3 {
      color: #ffffff;
      font-weight: 700;
    }

    /* Muted Code Blocks */
    pre[class*="language-"] {
      background: #0f0f14 !important;
      border: 1px solid rgba(255,255,255,0.05) !important;
      border-radius: 12px !important;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    code {
        color: #e2e8f0 !important;
    }

    /* Muted Images */
    .markdown-section img {
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    /* Better Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--base-background); }
    ::-webkit-scrollbar-thumb { background: #26262e; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--theme-color); }
  </style>
</head>
<body>
  <div id="app">Loading Dashboard...</div>
  <script>
    window.$docsify = {
      name: 'CYVUI',
      repo: 'https://github.com/urmoit/CYVUILibrary',
      loadSidebar: true,
      loadNavbar: true,
      coverpage: true,
      auto2top: true,
      subMaxLevel: 3,
      search: {
        placeholder: 'Search documentation...',
        noData: 'No results found',
        depth: 6
      },
      copyCode: {
        buttonText : 'Copy',
        successText: 'Copied'
      }
    }
  </script>
  
  <!-- Docsify Core and Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-lua.min.js"></script>
</body>
</html>
