<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CYVUI | Documentation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Themeable Plugin CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  
<style>
    :root {
      /* Muted Dark Palette */
      --theme-color: #8b5cf6;
      --base-background: #0a0a0d;
      --sidebar-background: #0d0d11;
      --sidebar-width: 280px;
      
      /* Typography */
      --base-font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      --heading-color: #ffffff;
      --text-color-base: #94a3b8;
    }

    /* Remove the violet box/glow from the cover page */
    section.cover {
      background-color: #0a0a0d !important;
    }

    section.cover .cover-main {
      color: #f8fafc;
    }

    /* Clean Title Styling */
    section.cover h1 {
      font-weight: 800;
      letter-spacing: -2px;
      color: #ffffff;
      margin-bottom: 0;
    }

    section.cover h1 span {
      color: var(--theme-color);
    }

    /* Minimalist Buttons - No Glow */
    section.cover p a {
      border-radius: 6px !important;
      padding: 10px 24px !important;
      font-weight: 600 !important;
      transition: all 0.2s ease;
      border: 1px solid #1e293b !important;
      background: transparent !important;
      color: #f1f5f9 !important;
      margin: 0 5px !important;
    }

    section.cover p a:first-of-type {
      background: #ffffff !important;
      color: #000000 !important;
      border: 1px solid #ffffff !important;
    }

    section.cover p a:hover {
      border-color: var(--theme-color) !important;
      color: var(--theme-color) !important;
      background: transparent !important;
    }

    /* Sidebar - Muted */
    .sidebar {
      border-right: 1px solid #1e293b;
      background-color: var(--sidebar-background) !important;
    }

    .sidebar-nav li > a {
      color: #64748b !important;
    }

    .sidebar-nav li.active > a {
      color: #ffffff !important;
      border-left: 2px solid var(--theme-color);
      background: rgba(255,255,255,0.03);
    }

    /* Modern Text blocks */
    blockquote {
      background: #111116 !important;
      border-left: 3px solid #334155 !important;
      color: #94a3b8 !important;
    }

    /* Hide the violet block seen in your screenshot */
    section.cover blockquote {
        background: transparent !important;
        border: none !important;
        font-size: 1.5rem;
        color: #94a3b8 !important;
    }
  </style>
</head>
<body>
  <div id="app">Loading Dashboard...</div>
  <script>
    window.$docsify = {
      name: 'CYVUI',
      repo: 'https://github.com/urmoit/CYVUILibrary',
      loadSidebar: true,
      loadNavbar: true,
      coverpage: true, // Enabling the cover page!
      executeScript: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        maxAge: 86400000,
        placeholder: 'Search documentation...',
        noData: 'No results found',
        depth: 6
      },
      copyCode: {
        buttonText : 'Copy',
        successText: 'Copied'
      },
        themeable: {
      readyTransition : true,
      responsiveTables: true
  }
    }
  </script>
  
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-lua.min.js"></script>
</body>
</html>
