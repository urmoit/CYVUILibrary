<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CYVUI | Documentation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Themeable Plugin CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  
<style>
  :root {
    /* Muted Slate & Dashboard Palette */
    --theme-color: #8b5cf6;
    --base-background: #0a0a0d;
    --sidebar-background: #0f0f13;
    --sidebar-width: 290px;
    
    /* Content styling */
    --content-max-width: 900px;
    --base-font-family: 'Inter', -apple-system, sans-serif;
    --code-theme-background: #13131a;
    --heading-color: #ffffff;
    --text-color-base: #94a3b8;
  }

  /* 1. Make Coverpage Non-Scrollable */
  section.cover {
    height: 100vh;
    overflow: hidden; /* Prevents scrolling on the landing */
    background-color: var(--base-background) !important;
  }

  /* 2. Unify Backgrounds (Sidebar + Content) */
  body, .app-nav, article#main {
    background-color: var(--base-background) !important;
  }

  .sidebar {
    background-color: var(--sidebar-background) !important;
    border-right: 1px solid rgba(255, 255, 255, 0.05);
  }

  /* 3. Muted Typography & Headers */
  .markdown-section h1, .markdown-section h2, .markdown-section h3 {
    color: #ffffff;
    font-weight: 700;
  }

  .markdown-section p, .markdown-section li {
    color: #94a3b8;
    line-height: 1.7;
  }

  /* 4. Muted Coverpage Elements (No Glow) */
  section.cover h1 {
    font-size: 4rem;
    font-weight: 800;
    margin-bottom: 10px;
  }

  section.cover h1 span {
    color: var(--theme-color);
  }

  /* Matching Dashboard Buttons */
  section.cover p a {
    border-radius: 8px !important;
    padding: 12px 28px !important;
    font-weight: 600 !important;
    transition: all 0.2s ease;
    background: #16161e !important;
    border: 1px solid #26262e !important;
    color: #ffffff !important;
  }

  section.cover p a:first-of-type {
    background: #ffffff !important;
    color: #000000 !important;
    border: 1px solid #ffffff !important;
  }

  section.cover p a:hover {
    border-color: var(--theme-color) !important;
    color: var(--theme-color) !important;
    background: transparent !important;
  }

  /* 5. Sidebar Integration */
  .sidebar-nav li > a {
    font-size: 14px;
    color: #64748b !important;
    transition: 0.2s;
  }

  .sidebar-nav li.active > a {
    color: #ffffff !important;
    font-weight: 600;
    border-left: 2px solid var(--theme-color);
    background: linear-gradient(90deg, rgba(139, 92, 246, 0.05) 0%, transparent 100%);
  }

  /* 6. Muted Code Blocks & Images */
  pre[class*="language-"] {
    background: #111116 !important;
    border: 1px solid rgba(255,255,255,0.05) !important;
    border-radius: 10px !important;
  }

  .markdown-section img {
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.05);
  }
</style>
</head>
<body>
  <div id="app">Loading Dashboard...</div>
  <script>
    window.$docsify = {
      name: 'CYVUI',
      repo: 'https://github.com/urmoit/CYVUILibrary',
      loadSidebar: true,
      loadNavbar: true,
      coverpage: true, // Enabling the cover page!
      executeScript: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        maxAge: 86400000,
        placeholder: 'Search documentation...',
        noData: 'No results found',
        depth: 6
      },
      copyCode: {
        buttonText : 'Copy',
        successText: 'Copied'
      },
        themeable: {
      readyTransition : true,
      responsiveTables: true
  }
    }
  </script>
  
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-lua.min.js"></script>
</body>
</html>
