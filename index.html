<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CYVUI · Documentation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="CYVUI — dark, modern, high-performance Roblox UI library. 20+ widgets, live theme engine, built-in Home &amp; Settings layouts.">
  <meta name="theme-color" content="#08090c">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230b0c10'/><path d='M66 34a22 22 0 1 0 0 32' fill='none' stroke='%2322d3ee' stroke-width='11' stroke-linecap='round'/></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">

  <style>
    /* ════════════════════════════════════════════════════════
       CYVUI Docs — v1.1.0 theme
       Palette mirrors the library itself: near-black surfaces,
       silver gradient accents, cyan for interactive states.
       ════════════════════════════════════════════════════════ */
    :root{
      --bg:            #08090c;
      --bg-soft:       #0d0e13;
      --panel:         #12141b;
      --panel-2:       #171922;
      --code-bg:       #0c0d12;

      --line:          rgba(255,255,255,.07);
      --line-strong:   rgba(255,255,255,.14);

      --text:          #e8e8f0;
      --muted:         #9494a6;
      --faint:         #61617a;

      --accent:        #22d3ee;
      --accent-dim:    rgba(34,211,238,.12);
      --violet:        #8b5cf6;

      /* library's signature white → gray gradient */
      --grad:          linear-gradient(100deg,#ffffff 0%,#d2d2de 42%,#8e8ea0 100%);

      --sidebar-w:     292px;
      --radius:        14px;
      --radius-sm:     10px;

      --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    /* ── base ─────────────────────────────────────────────── */
    *{ box-sizing:border-box; }

    html, body{
      margin:0; padding:0;
      background: var(--bg) !important;
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    /* ambient glows behind everything */
    body::before{
      content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
      background:
        radial-gradient(900px 520px at 10% -12%, rgba(34,211,238,.11), transparent 62%),
        radial-gradient(820px 520px at 96% -4%,  rgba(139,92,246,.09), transparent 62%),
        radial-gradient(760px 620px at 48% 112%, rgba(34,211,238,.05), transparent 62%);
    }

    ::selection{ background: rgba(34,211,238,.28); color:#fff; }

    /* ── scrollbars ───────────────────────────────────────── */
    ::-webkit-scrollbar{ width:10px; height:10px; }
    ::-webkit-scrollbar-track{ background:transparent; }
    ::-webkit-scrollbar-thumb{
      background: rgba(255,255,255,.09);
      border-radius:99px;
      border:3px solid transparent;
      background-clip:content-box;
    }
    ::-webkit-scrollbar-thumb:hover{ background: rgba(34,211,238,.45); background-clip:content-box; }

    /* ── scroll progress + back to top ────────────────────── */
    .scroll-progress{
      position:fixed; top:0; left:0; height:2px; width:0;
      z-index:60; pointer-events:none;
      background: var(--grad);
      box-shadow:0 0 12px rgba(34,211,238,.5);
      transition: width .08s linear;
    }
    .to-top{
      position:fixed; right:26px; bottom:26px; z-index:60;
      width:42px; height:42px; border-radius:50%;
      display:grid; place-items:center;
      background: var(--panel-2);
      border:1px solid var(--line-strong);
      color: var(--muted);
      cursor:pointer;
      opacity:0; transform:translateY(10px) scale(.9);
      pointer-events:none;
      transition:.25s cubic-bezier(.4,0,.2,1);
      box-shadow:0 10px 30px rgba(0,0,0,.5);
    }
    .to-top.show{ opacity:1; transform:none; pointer-events:auto; }
    .to-top:hover{ color:#fff; border-color:rgba(34,211,238,.55); transform:translateY(-2px); }

    /* ════════════════════════════════════════════════════════
       NAVBAR
       ════════════════════════════════════════════════════════ */
    .app-nav{
      background: transparent !important;
      border:none !important;
      box-shadow:none !important;
      margin: 22px 34px 0 0 !important;
    }
    .app-nav ul, .app-nav li{ background:transparent !important; border:none !important; }

    .app-nav li a{
      color: var(--muted) !important;
      font-size:13.5px; font-weight:500;
      padding:7px 15px !important;
      border-radius:99px;
      border:1px solid transparent;
      transition:.2s;
    }
    .app-nav li a:hover{
      color:#fff !important;
      background: rgba(255,255,255,.05) !important;
      border-color: var(--line);
    }

    .app-name, .app-name-link{
      color:#fff !important;
      font-weight:700 !important;
      letter-spacing:-.02em;
    }

    /* ════════════════════════════════════════════════════════
       COVER / HERO
       ════════════════════════════════════════════════════════ */
    /* Not fixed — the hero is a full-height band that the README flows beneath,
       so the page stays scrollable instead of trapping the visitor. */
    section.cover{
      position:relative;
      z-index:2;
      min-height:100vh;
      height:auto !important;
      display:flex !important;
      align-items:center;
      justify-content:center;
      padding:80px 0 60px;
      background: transparent !important;
      overflow:hidden;
    }
    body.has-cover main{ background:transparent !important; }

    /* grid + glow backdrop */
    section.cover::before{
      content:''; position:absolute; inset:0; pointer-events:none;
      background-image:
        linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
      background-size:52px 52px;
      mask-image: radial-gradient(ellipse 78% 62% at 50% 44%, #000 35%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 78% 62% at 50% 44%, #000 35%, transparent 100%);
    }
    section.cover::after{
      content:''; position:absolute; width:820px; height:820px; left:50%; top:46%;
      transform:translate(-50%,-50%);
      pointer-events:none;
      background: radial-gradient(circle, rgba(34,211,238,.13), rgba(139,92,246,.07) 42%, transparent 68%);
      filter: blur(28px);
    }

    section.cover .cover-main{
      position:relative; z-index:2;
      margin:0 auto !important;
      max-width:960px;
      padding:0 28px;
      text-align:center;
      animation: heroIn .7s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes heroIn{
      from{ opacity:0; transform:translateY(22px); }
      to  { opacity:1; transform:none; }
    }

    .hero-badge{
      display:inline-flex; align-items:center; gap:9px;
      margin:0 0 26px !important;
      padding:7px 15px 7px 11px;
      border-radius:99px;
      background: rgba(255,255,255,.04);
      border:1px solid var(--line-strong);
      color: var(--muted) !important;
      font-size:12.5px; font-weight:500; letter-spacing:.01em;
    }
    .hero-badge::before{
      content:''; width:6px; height:6px; border-radius:50%;
      background: var(--accent);
      box-shadow:0 0 0 4px rgba(34,211,238,.16);
    }

    section.cover h1{
      margin:0 0 20px !important;
      font-size: clamp(2.9rem, 8vw, 5.2rem) !important;
      font-weight:800 !important;
      letter-spacing:-.045em !important;
      line-height:1 !important;
      background: var(--grad);
      -webkit-background-clip:text; background-clip:text;
      -webkit-text-fill-color:transparent; color:transparent;
    }

    .hero-sub{
      max-width:620px;
      margin:0 auto 44px !important;
      color: var(--muted) !important;
      font-size:16.5px; line-height:1.65;
    }

    /* feature cards */
    .hero-cards{
      display:grid;
      grid-template-columns:repeat(3, minmax(0,1fr));
      gap:14px;
      margin:0 auto 42px;
      max-width:820px;
      text-align:left;
    }
    .hero-card{
      padding:20px 20px 22px;
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.015));
      border:1px solid var(--line);
      transition:.25s cubic-bezier(.4,0,.2,1);
    }
    .hero-card:hover{
      transform:translateY(-4px);
      border-color:rgba(34,211,238,.34);
      background: linear-gradient(180deg, rgba(34,211,238,.07), rgba(255,255,255,.02));
    }
    .hero-card .hc-ico{
      display:grid; place-items:center;
      width:38px; height:38px; margin-bottom:14px;
      border-radius:11px;
      background: rgba(34,211,238,.1);
      border:1px solid rgba(34,211,238,.2);
      font-size:17px; line-height:1;
    }
    .hero-card h4{
      margin:0 0 6px !important;
      font-size:14.5px; font-weight:650; color:#fff;
      letter-spacing:-.01em;
    }
    .hero-card p{
      margin:0 !important;
      font-size:13px; line-height:1.55; color: var(--faint) !important;
    }

    /* install snippet */
    .hero-code{
      max-width:660px;
      margin:0 auto 34px;
      padding:14px 20px;
      border-radius: var(--radius);
      background: var(--code-bg);
      border:1px solid var(--line);
      box-shadow:0 16px 40px rgba(0,0,0,.45);
      text-align:left;
    }
    .hero-code code{
      font-family: var(--mono);
      font-size:12.4px;
      line-height:1.65;
      color:#cfcfe0;
      white-space:pre-wrap;
      word-break:break-word;
    }
    .hero-code .k{ color:#c4a7f7; }
    .hero-code .s{ color:#9be8a6; }
    .hero-code .f{ color:#7fd6f5; }
    .hero-code .c{ color:#55556b; font-style:italic; }

    /* CTA buttons (markdown links render as p > a) */
    section.cover .cover-main > p:last-of-type{
      display:flex; gap:12px; justify-content:center; flex-wrap:wrap;
      margin:0 !important;
    }
    section.cover p a{
      display:inline-flex; align-items:center; gap:7px;
      border-radius:99px !important;
      padding:13px 30px !important;
      font-size:14.5px; font-weight:600 !important;
      letter-spacing:-.005em;
      transition:.22s cubic-bezier(.4,0,.2,1) !important;
      background: var(--panel-2) !important;
      border:1px solid var(--line-strong) !important;
      color: var(--text) !important;
      margin:0 !important;
      text-decoration:none !important;
    }
    section.cover p a:hover{
      transform:translateY(-2px);
      border-color: rgba(34,211,238,.5) !important;
      color:#fff !important;
      box-shadow:0 12px 34px rgba(0,0,0,.45), 0 0 0 4px rgba(34,211,238,.07);
    }
    section.cover p a:first-of-type{
      background: #fff !important;
      color:#07080b !important;
      border-color:#fff !important;
    }
    section.cover p a:first-of-type:hover{
      background:#fff !important;
      box-shadow:0 12px 34px rgba(255,255,255,.18);
    }

    .hero-scroll{
      margin-top:52px;
      color: var(--faint);
      font-size:11px; letter-spacing:.22em; text-transform:uppercase;
      animation: bob 2.4s ease-in-out infinite;
    }
    @keyframes bob{ 0%,100%{ transform:translateY(0); opacity:.55 } 50%{ transform:translateY(5px); opacity:1 } }

    @media (max-width:720px){
      .hero-cards{ grid-template-columns:1fr; max-width:420px; }
      .hero-sub{ font-size:15px; }
    }

    /* ════════════════════════════════════════════════════════
       SIDEBAR
       ════════════════════════════════════════════════════════ */
    .sidebar{
      background: var(--bg-soft) !important;
      border-right:1px solid var(--line) !important;
      width: var(--sidebar-w) !important;
      padding:0 0 18px !important;
      display:flex; flex-direction:column;
    }
    .sidebar-nav{
      flex:1;
      overflow-y:auto;
      padding:6px 14px 14px !important;
    }
    .sidebar::-webkit-scrollbar, .sidebar-nav::-webkit-scrollbar{ width:8px; }

    /* injected brand */
    .sb-brand{
      display:flex; align-items:center; gap:11px;
      padding:20px 20px 16px;
      border-bottom:1px solid var(--line);
      margin-bottom:12px;
    }
    .sb-logo{ display:flex; align-items:center; gap:11px; text-decoration:none; }
    .sb-mark{
      display:grid; place-items:center;
      width:34px; height:34px; flex:none;
      border-radius:10px;
      background: linear-gradient(140deg,#20222c,#14151c);
      border:1px solid var(--line-strong);
      color: var(--accent);
      font-weight:800; font-size:16px;
      letter-spacing:-.03em;
    }
    .sb-txt{
      display:flex; flex-direction:column; line-height:1.15;
      color:#fff; font-weight:700; font-size:15px; letter-spacing:-.02em;
    }
    .sb-txt b{ font-weight:500; font-size:11.5px; color: var(--faint); letter-spacing:.02em; }
    .sb-ver{
      margin-left:auto;
      padding:4px 9px; border-radius:99px;
      background: var(--accent-dim);
      border:1px solid rgba(34,211,238,.24);
      color: var(--accent);
      font-family: var(--mono); font-size:10.5px; font-weight:600;
    }

    /* nav links */
    .sidebar-nav > ul{ margin:0; padding:0; }
    .sidebar-nav li{ margin:1px 0; }

    .sidebar-nav li > a{
      display:block;
      color: var(--muted) !important;
      font-size:13.5px; font-weight:500;
      padding:8px 12px !important;
      border-radius: var(--radius-sm);
      border:1px solid transparent;
      transition:.18s;
    }
    .sidebar-nav li > a:hover{
      color:#fff !important;
      background: rgba(255,255,255,.045) !important;
    }
    .sidebar-nav li.active > a{
      color:#fff !important;
      font-weight:600;
      background: linear-gradient(90deg, rgba(34,211,238,.14), rgba(34,211,238,.02)) !important;
      border-color: rgba(34,211,238,.2);
      box-shadow: inset 2px 0 0 var(--accent);
    }

    /* group headings (bold list items) */
    .sidebar-nav li > p,
    .sidebar-nav li strong,
    .sidebar-nav > ul > li > a[href=""]{
      color: var(--faint) !important;
    }
    .sidebar-nav li p{
      margin:16px 0 6px !important;
      padding:0 12px;
      font-size:10.5px !important;
      font-weight:700 !important;
      letter-spacing:.14em;
      text-transform:uppercase;
      color: var(--faint) !important;
    }
    .sidebar-nav li p strong{ color: var(--faint) !important; font-weight:700 !important; }

    /* injected footer */
    .sb-foot{
      display:flex; gap:8px;
      padding:14px 20px 0;
      margin:12px 20px 0;
      border-top:1px solid var(--line);
    }
    .sb-foot a{
      flex:1;
      text-align:center;
      padding:8px 0;
      border-radius: var(--radius-sm);
      border:1px solid var(--line);
      background: rgba(255,255,255,.022);
      color: var(--muted) !important;
      font-size:12px; font-weight:600;
      text-decoration:none !important;
      transition:.2s;
    }
    .sb-foot a:hover{
      color:#fff !important;
      border-color: rgba(34,211,238,.4);
      background: var(--accent-dim);
    }

    /* mobile sidebar toggle */
    .sidebar-toggle{
      background: var(--bg-soft) !important;
      border-right:1px solid var(--line) !important;
    }
    .sidebar-toggle-button{
      background: var(--panel-2) !important;
      border:1px solid var(--line-strong);
      border-radius:10px;
      padding:10px 12px;
    }
    .sidebar-toggle-button span{
      background: var(--muted) !important;
      height:2px; border-radius:2px;
    }

    /* ════════════════════════════════════════════════════════
       CONTENT
       ════════════════════════════════════════════════════════ */
    main, article#main{
      background: transparent !important;
      position:relative; z-index:1;
    }

    .markdown-section{
      max-width:880px !important;
      padding:48px 44px 90px !important;
      color: var(--text);
      font-size:15.5px;
      line-height:1.75;
    }
    .markdown-section p{ margin:0 0 17px; color: var(--text); }

    /* headings */
    .markdown-section h1{
      margin:0 0 14px !important;
      font-size:2.55rem !important;
      font-weight:800; letter-spacing:-.035em; line-height:1.12;
      background: var(--grad);
      -webkit-background-clip:text; background-clip:text;
      -webkit-text-fill-color:transparent; color:transparent;
    }
    .markdown-section h2{
      margin:52px 0 18px !important;
      padding-bottom:12px;
      font-size:1.5rem !important; font-weight:700; letter-spacing:-.025em;
      color:#fff !important;
      border-bottom:1px solid var(--line);
    }
    .markdown-section h3{
      margin:36px 0 14px !important;
      font-size:1.13rem !important; font-weight:650; letter-spacing:-.015em;
      color:#fff !important;
    }
    .markdown-section h4{
      margin:26px 0 12px !important;
      font-size:1rem !important; font-weight:650;
      color:#fff !important;
    }
    /* Heading anchor link — in themeable, `.anchor` wraps the heading text
       (the # glyph is not a separate element). Earlier we set
       opacity:0 on `.anchor span` to hide the #, which instead hid the
       heading text itself. Keep the text visible, force inherit so it
       never picks up the cyan link color, and show a small "#" in the
       left gutter on hover. */
    .markdown-section :is(h1,h2,h3,h4){ position:relative; }
    .markdown-section a.anchor{
      color: inherit !important;
      border-bottom: none !important;
      text-decoration: none !important;
      font-weight: inherit;
    }
    .markdown-section a.anchor span{
      color: inherit !important;
      opacity: 1 !important;
    }
    .markdown-section a.anchor::before{
      content: '#';
      position: absolute;
      left: -22px; top: 0;
      color: var(--accent);
      font-weight: 400;
      opacity: 0;
      transform: translateX(4px);
      transition: .2s;
      pointer-events: none;
    }
    .markdown-section :is(h1,h2,h3,h4):hover a.anchor::before{
      opacity: 1;
      transform: none;
    }
    @media (max-width:1100px){
      .markdown-section a.anchor::before{ display:none; }
    }

    /* links */
    .markdown-section a{
      color: var(--accent) !important;
      font-weight:500;
      text-decoration:none;
      border-bottom:1px solid rgba(34,211,238,.28);
      transition:.18s;
    }
    .markdown-section a:hover{
      color:#fff !important;
      border-bottom-color:#fff;
    }

    /* horizontal rule */
    .markdown-section hr{
      height:1px; margin:48px 0; border:none;
      background: linear-gradient(90deg, transparent, var(--line-strong) 18%, var(--line-strong) 82%, transparent);
    }

    /* lists */
    .markdown-section ul, .markdown-section ol{ padding-left:22px; }
    .markdown-section li{ margin:7px 0; }
    .markdown-section ul > li::marker{ color: var(--accent); }
    .markdown-section ol > li::marker{ color: var(--accent); font-weight:600; }
    .markdown-section li > strong{ color:#fff; font-weight:650; }

    /* inline code */
    .markdown-section :not(pre) > code{
      padding:2.5px 7px !important;
      border-radius:6px;
      background: rgba(34,211,238,.1) !important;
      border:1px solid rgba(34,211,238,.16);
      color:#b8f2fb !important;
      font-family: var(--mono);
      font-size:.855em !important;
      white-space:nowrap;
    }

    /* code blocks — with a language bar */
    .markdown-section pre{
      position:relative;
      margin:0 0 22px !important;
      padding:42px 18px 18px !important;
      background: var(--code-bg) !important;
      border:1px solid var(--line) !important;
      border-radius: var(--radius) !important;
      box-shadow:0 14px 40px rgba(0,0,0,.4);
      overflow:auto;
    }
    .markdown-section pre::before{
      content: attr(data-lang);
      position:absolute; top:0; left:0; right:0; height:38px;
      display:flex; align-items:center;
      padding:0 16px 0 34px;
      background: rgba(255,255,255,.028);
      border-bottom:1px solid var(--line);
      border-radius: var(--radius) var(--radius) 0 0;
      font-family: var(--mono); font-size:10.5px; font-weight:600;
      letter-spacing:.16em; text-transform:uppercase;
      color: var(--faint);
      pointer-events:none;
    }
    .markdown-section pre::after{
      content:''; position:absolute; top:16px; left:16px;
      width:7px; height:7px; border-radius:50%;
      background: var(--accent); opacity:.55;
      pointer-events:none;
    }
    .markdown-section pre > code{
      display:block;
      background:none !important;
      border:none !important;
      padding:0 !important;
      color:#d7d7e4 !important;
      font-family: var(--mono);
      font-size:13.2px !important;
      line-height:1.7 !important;
      white-space:pre;
      text-shadow:none !important;
    }

    /* copy button */
    .docsify-copy-code-button{
      position:absolute !important;
      top:6px !important; right:8px !important;
      z-index:3;
      padding:5px 12px !important;
      border-radius:99px !important;
      background: rgba(255,255,255,.06) !important;
      border:1px solid var(--line-strong) !important;
      color: var(--muted) !important;
      font-family: var(--sans) !important;
      font-size:11px !important; font-weight:600 !important;
      letter-spacing:.02em;
      transition:.2s !important;
    }
    .docsify-copy-code-button:hover{
      background: var(--accent-dim) !important;
      border-color: rgba(34,211,238,.45) !important;
      color: var(--accent) !important;
    }
    .docsify-copy-code-button.success{
      background: rgba(34,211,238,.18) !important;
      color: var(--accent) !important;
      border-color: rgba(34,211,238,.5) !important;
    }

    /* Prism tokens */
    .token.comment, .token.prolog, .token.doctype, .token.cdata{ color:#55556b !important; font-style:italic; }
    .token.punctuation{ color:#7c7c93 !important; }
    .token.operator, .token.entity, .token.url{ color:#9aa7c7 !important; }
    .token.boolean, .token.number, .token.constant{ color:#f0a5c0 !important; }
    .token.string, .token.char, .token.attr-value{ color:#9be8a6 !important; }
    .token.keyword{ color:#c4a7f7 !important; font-weight:500; }
    .token.function, .token.method{ color:#7fd6f5 !important; }
    .token.class-name, .token.maybe-class-name{ color:#ffd9a0 !important; }
    .token.property, .token.attr-name{ color:#8fd3ff !important; }
    .token.variable, .token.parameter{ color:#e6e6f0 !important; }
    .token.tag, .token.selector, .token.regex, .token.important{ color:#f78c9c !important; }
    .token.builtin{ color:#8fd3ff !important; }

    /* tables */
    .markdown-section table{
      display:table;
      width:100%;
      margin:0 0 26px !important;
      border-collapse:separate !important;
      border-spacing:0;
      border:1px solid var(--line) !important;
      border-radius: var(--radius);
      overflow:hidden;
      font-size:14px;
    }
    .markdown-section table thead th{
      background: var(--panel) !important;
      color:#fff !important;
      font-weight:650; font-size:12.5px;
      letter-spacing:.03em; text-transform:uppercase;
      text-align:left;
      padding:12px 16px !important;
      border:none !important;
      border-bottom:1px solid var(--line-strong) !important;
    }
    .markdown-section table tbody tr{ transition:background .15s; }
    .markdown-section table tbody tr:nth-child(even){ background: rgba(255,255,255,.018); }
    .markdown-section table tbody tr:hover{ background: rgba(34,211,238,.06); }
    .markdown-section table td{
      padding:11px 16px !important;
      border:none !important;
      border-bottom:1px solid var(--line) !important;
      color: var(--muted);
      vertical-align:top;
    }
    .markdown-section table tbody tr:last-child td{ border-bottom:none !important; }
    .markdown-section table td strong{ color:#fff; }

    /* blockquotes / callouts */
    .markdown-section blockquote{
      margin:0 0 22px !important;
      padding:14px 18px !important;
      border-left:3px solid var(--accent) !important;
      border-radius:0 var(--radius-sm) var(--radius-sm) 0;
      background: linear-gradient(90deg, rgba(34,211,238,.07), rgba(34,211,238,.012)) !important;
      color: var(--text) !important;
    }
    .markdown-section blockquote p{ margin:0 !important; color: var(--text) !important; }
    .markdown-section blockquote strong{ color:#fff; }

    /* images */
    .markdown-section img{
      border-radius: var(--radius);
      border:1px solid var(--line);
      box-shadow:0 16px 44px rgba(0,0,0,.45);
      max-width:100%;
    }
    .markdown-section p > img:only-child{ margin:6px 0 26px; }

    /* badge images (shields.io) sit inline — kill the card look */
    .markdown-section img[src*="shields.io"]{
      border:none !important; box-shadow:none !important; border-radius:4px !important;
      margin:0 3px 0 0 !important; vertical-align:middle;
    }

    /* pagination (docsify-pagination) */
    .docsify-pagination-container{
      display:flex; gap:14px;
      margin-top:56px; padding-top:28px;
      border-top:1px solid var(--line);
    }
    .docsify-pagination-container .pagination-item{
      flex:1;
      padding:16px 20px !important;
      border-radius: var(--radius) !important;
      border:1px solid var(--line) !important;
      background: rgba(255,255,255,.022) !important;
      color: var(--muted) !important;
      transition:.22s !important;
    }
    .docsify-pagination-container .pagination-item:hover{
      border-color: rgba(34,211,238,.4) !important;
      background: var(--accent-dim) !important;
      transform:translateY(-2px);
    }
    .docsify-pagination-container .pagination-item-label{
      display:block;
      font-size:10.5px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
      color: var(--faint) !important;
      margin-bottom:5px;
    }
    .docsify-pagination-container .pagination-item-title{
      color:#fff !important; font-weight:600; font-size:14.5px;
    }
    .docsify-pagination-container .pagination-item--next{ text-align:right; }

    /* ════════════════════════════════════════════════════════
       SEARCH
       ════════════════════════════════════════════════════════ */
    .search{
      margin-bottom:14px !important;
      padding:0 6px;
    }
    .search .input-wrap{
      position:relative;
      border-radius: var(--radius-sm);
      border:1px solid var(--line);
      background: rgba(255,255,255,.03);
      transition:.2s;
    }
    .search .input-wrap:focus-within{
      border-color: rgba(34,211,238,.5);
      background: rgba(34,211,238,.05);
      box-shadow:0 0 0 3px rgba(34,211,238,.08);
    }
    .search input[type="search"]{
      width:100%;
      padding:10px 12px 10px 34px !important;
      background:transparent !important;
      border:none !important;
      border-radius: var(--radius-sm) !important;
      color:#fff !important;
      font-family: var(--sans) !important;
      font-size:13px !important;
    }
    .search input[type="search"]::placeholder{ color: var(--faint) !important; }
    .search input[type="search"]:focus{ outline:none !important; box-shadow:none !important; }
    .search .search-icon{ left:11px; opacity:.45; }
    .search .clear-button{ right:9px; opacity:.45; }

    .search .results-panel{
      margin-top:8px;
      border-radius: var(--radius) !important;
      border:1px solid var(--line) !important;
      background: var(--panel) !important;
      box-shadow:0 18px 44px rgba(0,0,0,.55);
      overflow:hidden;
    }
    .search .results-panel .matching-post{
      border-bottom:1px solid var(--line) !important;
    }
    .search .results-panel .matching-post a{
      color: var(--muted) !important;
    }
    .search .results-panel .matching-post a:hover{
      background: rgba(34,211,238,.08) !important;
    }
    .search .results-panel .search-keyword{
      color: var(--accent) !important;
      font-style:normal !important;
      font-weight:600;
    }

    /* ════════════════════════════════════════════════════════
       BOOT / LOADING
       ════════════════════════════════════════════════════════ */
    .boot{
      position:fixed; inset:0;
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
      background: var(--bg);
      color: var(--faint);
      font-size:13px; letter-spacing:.14em; text-transform:uppercase;
    }
    .boot-ring{
      width:34px; height:34px;
      border-radius:50%;
      border:2px solid rgba(255,255,255,.1);
      border-top-color: var(--accent);
      animation: spin .8s linear infinite;
    }
    @keyframes spin{ to{ transform:rotate(360deg) } }

    /* ════════════════════════════════════════════════════════
       RESPONSIVE
       ════════════════════════════════════════════════════════ */
    @media (max-width:1000px){
      .markdown-section{ padding:36px 26px 80px !important; }
    }
    @media (max-width:768px){
      .sidebar{
        width:82% !important;
        box-shadow:0 0 60px rgba(0,0,0,.7);
      }
      .markdown-section{
        padding:24px 20px 80px !important;
        font-size:15px;
      }
      .markdown-section h1{ font-size:2rem !important; }
      .app-nav{ margin:14px 16px 0 0 !important; }
      .to-top{ right:16px; bottom:16px; }
      .docsify-pagination-container{ flex-direction:column; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="boot"><div class="boot-ring"></div><p>Loading CYVUI</p></div>
  </div>

  <script>
    window.$docsify = {
      name: 'CYVUI',
      repo: 'https://github.com/urmoit/CYVUILibrary',
      homepage: 'README.md',
      loadSidebar: true,
      loadNavbar: true,
      coverpage: true,
      auto2top: true,
      subMaxLevel: 3,
      maxLevel: 4,
      externalLinkTarget: '_blank',
      relativePath: false,

      search: {
        placeholder: 'Search the docs…',
        noData: 'No results found',
        depth: 6
      },
      copyCode: {
        buttonText: 'Copy',
        successText: 'Copied!'
      },
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true,
        crossChapterText: true
      },

      plugins: [
        function (hook, vm) {
          hook.doneEach(function () {
            buildSidebarChrome();
            syncCoverState();
          });
        }
      ]
    };

    /* ── sidebar brand + footer ───────────────────────────── */
    function buildSidebarChrome () {
      var sb = document.querySelector('.sidebar');
      if (!sb || sb.querySelector('.sb-brand')) return;

      // docsify may render its own title block; drop it to avoid a duplicate
      var dupe = sb.querySelector('.app-name');
      if (dupe) dupe.remove();

      var brand = document.createElement('div');
      brand.className = 'sb-brand';
      brand.innerHTML =
        '<a class="sb-logo" href="#/">' +
          '<span class="sb-mark">C</span>' +
          '<span class="sb-txt">CYVUI<b>Library</b></span>' +
        '</a>' +
        '<span class="sb-ver">v1.1.0</span>';
      sb.insertBefore(brand, sb.firstChild);

      var foot = document.createElement('div');
      foot.className = 'sb-foot';
      foot.innerHTML =
        '<a href="https://discord.gg/vTe3sNTsDM" target="_blank" rel="noopener">Discord</a>' +
        '<a href="https://github.com/urmoit/CYVUILibrary" target="_blank" rel="noopener">GitHub</a>';
      sb.appendChild(foot);
    }

    /* ── track whether the hero is on screen ──────────────── */
    function syncCoverState () {
      document.body.classList.toggle('has-cover', !!document.querySelector('section.cover'));
      onScroll();
    }

    /* ── scroll progress + back-to-top ────────────────────── */
    var bar = document.createElement('div');
    bar.className = 'scroll-progress';
    document.body.appendChild(bar);

    var toTop = document.createElement('button');
    toTop.className = 'to-top';
    toTop.setAttribute('aria-label', 'Back to top');
    toTop.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
    document.body.appendChild(toTop);

    toTop.addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    function onScroll () {
      var y = window.scrollY;
      var h = document.documentElement.scrollHeight - window.innerHeight;
      bar.style.width = (h > 0 ? (y / h) * 100 : 0) + '%';
      if (!document.body.classList.contains('has-cover')) {
        toTop.classList.toggle('show', y > 420);
      }
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
  </script>

  <!-- Docsify core + plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>

  <!-- Syntax highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-lua.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
