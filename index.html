<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>CYVUI · Documentation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="CYVUI — a native-style, high-performance Roblox UI library. 20+ widgets, live theme engine, built-in Home &amp; Settings layouts.">
  <meta name="theme-color" content="#1c1c1e">

  <!-- Resolve the appearance before the first paint so a light-mode visitor
       never sees a dark flash. Follows the OS unless the visitor pinned
       Light/Dark with the Appearance control in the sidebar footer. -->
  <script>
    (function () {
      var mode = 'system';
      try {
        var stored = localStorage.getItem('cyvui-appearance');
        if (stored === 'light' || stored === 'dark') mode = stored;
      } catch (e) { /* private mode */ }

      var light = mode === 'light' || (
        mode === 'system' &&
        window.matchMedia &&
        window.matchMedia('(prefers-color-scheme: light)').matches
      );

      var root = document.documentElement;
      root.setAttribute('data-theme', light ? 'light' : 'dark');
      root.setAttribute('data-appearance', mode);
    })();
  </script>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%232c2c2e'/><path d='M66 34a22 22 0 1 0 0 32' fill='none' stroke='%23d5d7db' stroke-width='11' stroke-linecap='round'/></svg>">

  <!-- Docsify layout primitives only: every colour it ships is re-mapped to
       the native tokens below. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">

  <style>
    /* ══════════════════════════════════════════════════════════════
       CYVUI Docs — native (macOS) theme

       Modelled on a macOS app window: graphite surfaces, 1px hairline
       separators, continuous-corner radii, system fonts, sidebar chrome,
       titlebar/toolbar strips and push buttons with a bezel.

       Deliberately free of neon: no cyan or violet accents, no ambient glow
       blobs, no blurred radial light, no gradient-clipped text, no pills.
       Appearance follows the OS (light or dark) and can be pinned with the
       segmented Appearance control at the bottom of the sidebar.
       ══════════════════════════════════════════════════════════════ */

    :root {
      color-scheme: dark;

      /* ── window surfaces ──────────────────────────────────── */
      --bg:            #1c1c1e;   /* content area           */
      --bg-pane:       #262628;   /* sidebar                */
      --bg-pane-2:     #2d2d30;
      --win:           #232325;   /* window / card surface  */
      --panel:         #2a2a2d;
      --panel-2:       #3a3a3c;   /* control bezel          */
      --field:         #333336;
      --bar-1:         #303033;   /* titlebar gradient top  */
      --bar-2:         #26262a;   /* titlebar gradient base */
      --code-bg:       #1f1f21;
      --code-bar:      #26262a;

      /* ── separators ───────────────────────────────────────── */
      --line:          rgba(255,255,255,.10);
      --line-strong:   rgba(255,255,255,.17);

      /* ── labels (macOS label hierarchy) ───────────────────── */
      --text:          #ececee;
      --muted:         #9b9ba2;   /* secondary label */
      --faint:         #6d6d74;   /* tertiary label  */

      /* ── accent: Apple system blue, desaturated ───────────── */
      --accent:        #4b9cd6;
      --accent-fill:   #2f6ba1;
      --accent-fill-h: #3a7cb6;
      --accent-dim:    rgba(75,156,214,.16);
      --on-accent:     #f7fafc;
      --focus:         rgba(75,156,214,.38);

      /* ── interaction tints ────────────────────────────────── */
      --hover:         rgba(255,255,255,.055);
      --active:        rgba(255,255,255,.09);
      --sel:           rgba(75,156,214,.30);
      --scroll:        rgba(255,255,255,.16);
      --scroll-h:      rgba(255,255,255,.30);

      /* ── traffic lights (standard window controls) ────────── */
      --tl-r:   #e0574f;
      --tl-a:   #d8a13c;
      --tl-g:   #57a860;
      --tl-off: rgba(255,255,255,.14);

      /* ── elevation / inset ────────────────────────────────── */
      --win-shadow:    0 1px 2px rgba(0,0,0,.32), 0 26px 64px rgba(0,0,0,.46);
      --field-shadow:  0 1px 0 rgba(255,255,255,.05) inset;
      --btn-shadow:    0 1px 0 rgba(255,255,255,.07) inset, 0 1px 2px rgba(0,0,0,.30);
      --flyout-shadow: 0 1px 2px rgba(0,0,0,.34), 0 14px 34px rgba(0,0,0,.44);
      --ico:           #c2c4c9;
      --ico-bg:        #343438;

      /* derived chrome / label aliases used by the rules below */
      --chrome:        rgba(38,38,40,.82);   /* translucent sidebar material */
      --text-2:        #d6d7db;              /* label, one step under primary */
      --link:          #6ba4d8;
      --sel-strong:    rgba(255,255,255,.12); /* source-list selection (inactive) */
      --inset-shadow:  0 1px 1px rgba(0,0,0,.28) inset, 0 1px 0 rgba(255,255,255,.05);

      /* ── syntax (Xcode-style, low saturation) ─────────────── */
      --syn-txt:  #dfe1e5;
      --syn-com:  #7c818a;
      --syn-pun:  #a2a6ad;
      --syn-kw:   #9b8ed0;
      --syn-str:  #cf8f78;
      --syn-num:  #d3a76e;
      --syn-fn:   #85b0d8;
      --syn-cls:  #7fbd9b;
      --syn-prop: #9db9cf;
      --syn-op:   #b3b7bd;
      --syn-tag:  #c68d84;

      /* ── metrics ──────────────────────────────────────────── */
      --sidebar-w:  272px;
      --radius:     10px;
      --radius-sm:  7px;
      --radius-xs:  5px;
      --row-h:      28px;

      /* ── system fonts (no webfonts — native by definition) ── */
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue",
              "Segoe UI", Roboto, Arial, sans-serif;
      --display: -apple-system, BlinkMacSystemFont, "SF Pro Display",
              "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
      --mono: ui-monospace, "SF Mono", "Menlo", "Cascadia Mono", Consolas,
              "Liberation Mono", monospace;
    }

    /* ── light appearance (aqua) ──────────────────────────────── */
    :root[data-theme="light"] {
      color-scheme: light;

      --bg:            #ffffff;
      --bg-pane:       #f4f4f6;
      --bg-pane-2:     #ebebee;
      --win:           #fbfbfc;
      --panel:         #f5f5f7;
      --panel-2:       #ffffff;
      --field:         #ffffff;
      --bar-1:         #f4f4f6;
      --bar-2:         #eaeaec;
      --code-bg:       #fafafb;
      --code-bar:      #f3f3f5;

      --line:          rgba(0,0,0,.10);
      --line-strong:   rgba(0,0,0,.16);

      --text:          #1d1d1f;
      --muted:         #6a6a70;
      --faint:         #8d8d94;

      --accent:        #1c6cb4;
      --accent-fill:   #2b6fae;
      --accent-fill-h: #3580c2;
      --accent-dim:    rgba(28,108,180,.10);
      --on-accent:     #ffffff;
      --focus:         rgba(28,108,180,.32);

      --hover:         rgba(0,0,0,.045);
      --active:        rgba(0,0,0,.075);
      --sel:           rgba(28,108,180,.22);
      --scroll:        rgba(0,0,0,.22);
      --scroll-h:      rgba(0,0,0,.36);

      --tl-off:        rgba(0,0,0,.14);

      --win-shadow:    0 1px 2px rgba(0,0,0,.08), 0 24px 56px rgba(0,0,0,.16);
      --field-shadow:  0 1px 1px rgba(0,0,0,.05) inset;
      --btn-shadow:    0 1px 0 rgba(255,255,255,.9) inset, 0 1px 2px rgba(0,0,0,.09);
      --flyout-shadow: 0 1px 2px rgba(0,0,0,.10), 0 14px 30px rgba(0,0,0,.18);
      --ico:           #4e4e55;
      --ico-bg:        #ececee;

      --chrome:        rgba(246,246,248,.86);
      --text-2:        #33343a;
      --link:          #1c6cb4;
      --sel-strong:    rgba(0,0,0,.07);
      --inset-shadow:  0 1px 1px rgba(0,0,0,.07) inset, 0 1px 0 rgba(255,255,255,.9);


      --syn-txt:  #24252a;
      --syn-com:  #7b8189;
      --syn-pun:  #575c63;
      --syn-kw:   #6b4fa8;
      --syn-str:  #a4442c;
      --syn-num:  #8a5a1f;
      --syn-fn:   #2f6b9e;
      --syn-cls:  #2f7a55;
      --syn-prop: #3d6b8a;
      --syn-op:   #4f545b;
      --syn-tag:  #9a4a42;
    }

    /* ══════════════════════════════════════════════════════════════
       Docsify-themeable token map
       theme-simple-dark ships hue-driven HSL ramps; pinning the hue and
       every colour token below means one native palette drives both the
       themeable layout and the hand-written rules further down.
       ══════════════════════════════════════════════════════════════ */
    :root {
      --theme-color:        var(--accent);
      --theme-hue:          208;
      --theme-saturation:   34%;
      --theme-lightness:    52%;
      --mono-hue:           224;
      --mono-saturation:    4%;

      --base-background-color: var(--bg);
      --base-color:            var(--text);
      --base-font-family:      var(--sans);
      --base-font-size:        16px;
      --base-font-weight:      400;
      --base-line-height:      1.65;
      --strong-color:          var(--text);
      --strong-font-weight:    600;
      --small-font-size:       .82em;
      --selection-color:       var(--sel);
      --mark-background:       var(--accent-dim);
      --mark-color:            var(--text);
      --hr-border:             1px solid var(--line);
      --emoji-size:            1.05em;

      --heading-color:          var(--text);
      --heading-font-weight:    600;
      --heading-h1-font-size:   1.95rem;
      --heading-h2-font-size:   1.28rem;
      --heading-h2-border-width: 0;
      --link-text-decoration:   none;

      --border-radius-s: var(--radius-xs);
      --border-radius-m: var(--radius-sm);
      --border-radius-l: var(--radius);
      --content-max-width: 900px;

      --sidebar-background:    var(--bg-pane);
      --sidebar-border-color:  var(--line);
      --sidebar-border-width:  0 1px 0 0;
      --sidebar-width:         var(--sidebar-w);
      --sidebar-padding:       0;
      --sidebar-name-color:    var(--text);
      --sidebar-nav-indent:    0;
      --sidebar-nav-link-color:              var(--muted);
      --sidebar-nav-link-color--active:      var(--text);
      --sidebar-nav-link-font-weight:        440;
      --sidebar-nav-link-padding:            6px 9px;
      --sidebar-nav-link-border-width:       0;
      --sidebar-nav-link-text-decoration:    none;
      --sidebar-nav-strong-color:            var(--faint);
      --sidebar-toggle-background:           var(--bg-pane);
      --sidebar-toggle-icon-color:           var(--muted);
      --sidebar-toggle-border-radius:        var(--radius-sm);

      --navbar-menu-background:   var(--panel);
      --navbar-menu-border-radius: var(--radius-sm);
      --navbar-menu-box-shadow:   var(--flyout-shadow);
      --code-font-family:      var(--mono);
      --code-font-size:        .85em;
      --code-font-weight:      400;
      --code-inline-background: var(--panel);
      --code-inline-color:      var(--text);
      --code-inline-border-radius: var(--radius-xs);
      --code-inline-padding:    2px 5px;
      --code-block-border-radius: var(--radius);
      --pre-font-family:        var(--mono);
      --pre-font-size:          .85em;

      --code-theme-background:  var(--code-bg);
      --code-theme-comment:     var(--syn-com);
      --code-theme-function:    var(--syn-fn);
      --code-theme-keyword:     var(--syn-kw);
      --code-theme-operator:    var(--syn-op);
      --code-theme-punctuation: var(--syn-pun);
      --code-theme-selector:    var(--syn-tag);
      --code-theme-tag:         var(--syn-tag);
      --code-theme-text:        var(--syn-txt);
      --code-theme-variable:    var(--syn-txt);

      --table-cell-border-color:  var(--line);
      --table-cell-border-width:  0 0 1px;
      --table-cell-padding:       9px 14px;
      --table-head-border-color:  var(--line-strong);
      --table-head-font-weight:   600;
      --table-row-odd-background: transparent;

      --blockquote-background:    var(--panel);
      --blockquote-border-color:  var(--line-strong);
      --blockquote-border-width:  0 0 0 3px;
      --blockquote-border-radius: var(--radius-sm);
      --blockquote-padding:       11px 14px;
      --blockquote-font-weight:   400;

      --notice-background:            var(--panel);
      --notice-border-radius:         var(--radius-sm);
      --notice-border-width:          0 0 0 3px;
      --notice-border-color:          var(--line-strong);
      --notice-font-weight:           400;
      --notice-important-background:  var(--panel);
      --notice-important-border-color: #b0564f;
      --notice-tip-background:        var(--panel);
      --notice-tip-border-color:      var(--accent-fill);

      --copycode-background: var(--panel-2);
      --copycode-color:      var(--muted);

      --cover-background-color:       transparent;
      --cover-background-image:       none;
      --cover-background-mask-opacity: 0;
      --cover-max-width:              880px;
      --cover-text-align:             left;
      --cover-heading-color:          var(--text);
      --cover-heading-font-weight:    640;
      --cover-border-color:           var(--line);
      --cover-button-border:          1px solid var(--line-strong);
      --cover-button-border-radius:   var(--radius-sm);
      --cover-button-color:           var(--text);
      --cover-button-padding:         7px 15px;
      --cover-button-primary-background: var(--accent-fill);
      --cover-button-primary-border:     1px solid var(--accent-fill);
      --cover-button-primary-color:      var(--on-accent);

      --pagination-border-top:   1px solid var(--line);
      --pagination-title-color:  var(--text);
      --pagination-chevron-stroke: var(--muted);

      --search-margin:                    0 0 12px;
      --search-input-background-color:    var(--field);
      --search-input-background-image:    none;
      --search-input-border-color:        var(--line-strong);
      --search-input-border-width:        1px;
      --search-input-placeholder-color:   var(--faint);
      --search-result-heading-color:      var(--text);
      --search-result-item-border-color:  var(--line);
      --search-result-keyword-background: var(--accent-dim);
      --search-result-keyword-color:      var(--accent);
      --search-clear-icon-color1:         var(--faint);

      --spinner-size:        26px;
      --spinner-track-color: var(--line-strong);
      --spinner-track-width: 2px;

      --kbd-background:    var(--panel-2);
      --kbd-border:        1px solid var(--line-strong);
      --kbd-border-radius: var(--radius-xs);
      --kbd-color:         var(--text);

      --zoomimage-overlay-background: rgba(0,0,0,.72);
    }



    /* ══════════════════════════════════════════════════════════════
       Base
       ══════════════════════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg) !important;
      color: var(--text);
      font-family: var(--sans);
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    ::selection { background: var(--sel); color: var(--text); }

    /* Overlay scrollbars — thin and rounded, like a Finder scroll view */
    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--scroll);
      border-radius: 99px;
      border: 2px solid transparent;
      background-clip: content-box;
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--scroll-h); background-clip: content-box; }
    ::-webkit-scrollbar-corner { background: transparent; }
    * { scrollbar-width: thin; scrollbar-color: var(--scroll) transparent; }

    /* macOS focus ring */
    :focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--focus);
      border-radius: var(--radius-xs);
    }
    a:focus-visible, .sidebar-nav a:focus-visible { border-radius: var(--radius-sm); }

    /* The GitHub octocat corner is not a desktop control — GitHub lives in
       the toolbar and the sidebar footer instead. */
    .github-corner { display: none !important; }

    /* Flat 3px load / scroll indicators — no glow */
    .progress { height: 3px !important; background-color: var(--accent-fill) !important; }
    .scroll-progress {
      position: fixed; top: 0; left: 0; z-index: 60;
      height: 3px; width: 0;
      background: var(--accent-fill);
      transition: width .1s linear;
    }

    /* Window controls (traffic lights) */
    .win-dots { display: inline-flex; gap: 8px; flex: none; }
    .win-dots i {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--tl-off);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.18);
      transition: background .15s ease;
    }
    .win-dots:hover i:nth-child(1) { background: var(--tl-r); }
    .win-dots:hover i:nth-child(2) { background: var(--tl-a); }
    .win-dots:hover i:nth-child(3) { background: var(--tl-g); }

    /* Back to top — square toolbar button */
    .to-top {
      position: fixed; right: 20px; bottom: 20px; z-index: 60;
      width: 36px; height: 36px;
      display: grid; place-items: center;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      background: var(--panel-2);
      box-shadow: var(--btn-shadow);
      color: var(--muted);
      cursor: default;
      opacity: 0;
      transform: translateY(6px);
      pointer-events: none;
      transition: opacity .15s ease, transform .15s ease, color .15s ease;
    }
    .to-top.show { opacity: 1; transform: none; pointer-events: auto; }
    .to-top:hover { color: var(--text); }
    .to-top:active { transform: translateY(1px); }

    /* ══════════════════════════════════════════════════════════════
       Toolbar (navbar) — flat text buttons over the content surface
       ══════════════════════════════════════════════════════════════ */
    .app-nav {
      margin: 14px 22px 0 0 !important;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
    }
    .app-nav ul, .app-nav li { background: transparent !important; border: none !important; }
    .app-nav li a {
      display: block;
      padding: 5px 11px !important;
      border-radius: var(--radius-sm);
      color: var(--muted) !important;
      font-size: 13px;
      font-weight: 500;
      transition: background .12s ease, color .12s ease;
    }
    .app-nav li a:hover {
      color: var(--text) !important;
      background: var(--hover) !important;
    }
    .app-nav ul > li > ul {
      margin-top: 6px;
      padding: 4px !important;
      border: 1px solid var(--line);
      background: var(--panel) !important;
      box-shadow: var(--flyout-shadow) !important;
    }
    .app-name, .app-name-link { display: none !important; }

    /* ══════════════════════════════════════════════════════════════
       Sidebar — Finder source list
       ══════════════════════════════════════════════════════════════ */
    .sidebar {
      background: var(--chrome) !important;
      border-right: 1px solid var(--line) !important;
      padding: 0 !important;
      backdrop-filter: saturate(1.6) blur(18px);
      -webkit-backdrop-filter: saturate(1.6) blur(18px);
    }
    .sidebar-toggle { display: none !important; }

    .cyv-side {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 0 0 10px;
    }

    /* Title bar */
    .cyv-title {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 13px 10px;
      flex: none;
    }
    .cyv-title .mark {
      width: 26px; height: 26px;
      flex: none;
      display: grid; place-items: center;
      border-radius: 7px;
      background: var(--accent-fill);
      color: var(--on-accent);
      font-size: 12px;
      font-weight: 650;
      box-shadow: var(--btn-shadow);
    }
    .cyv-title .name {
      font-size: 13px;
      font-weight: 640;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cyv-title .name small {
      display: block;
      font-size: 11px;
      font-weight: 450;
      color: var(--muted);
    }

    /* Search field — NSSearchField style */
    .cyv-search {
      position: relative;
      margin: 2px 12px 10px;
      flex: none;
    }
    .cyv-search input {
      width: 100% !important;
      height: 26px !important;
      margin: 0 !important;
      padding: 0 22px 0 26px !important;
      border: 1px solid var(--line-strong) !important;
      border-radius: 6px !important;
      background: var(--field) !important;
      background-image: none !important;
      box-shadow: var(--inset-shadow) !important;
      color: var(--text) !important;
      font: 400 12.5px/26px var(--sans) !important;
      outline: none !important;
    }
    .cyv-search input:focus {
      border-color: var(--accent-fill) !important;
      box-shadow: 0 0 0 3px var(--focus), var(--inset-shadow) !important;
    }
    .cyv-search::before {
      content: "";
      position: absolute;
      left: 8px; top: 50%;
      width: 11px; height: 11px;
      margin-top: -6px;
      border: 1.5px solid var(--faint);
      border-radius: 50%;
      pointer-events: none;
    }
    .cyv-search::after {
      content: "";
      position: absolute;
      left: 17px; top: 62%;
      width: 4px; height: 1.5px;
      background: var(--faint);
      border-radius: 1px;
      transform: rotate(45deg);
      pointer-events: none;
    }
    .cyv-search .clear { position: absolute; right: 4px; top: 3px; }

    /* Section label — small caps like an NSOutlineView group header */
    .cyv-section {
      padding: 8px 14px 4px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--faint);
      flex: none;
    }

    /* Source list rows */
    .sidebar-nav { flex: 1 1 auto; overflow: auto; padding: 0 8px !important; }
    .sidebar-nav > ul { padding: 0 !important; margin: 0 !important; }
    .sidebar-nav ul { padding-left: 0; margin: 0; }
    .sidebar-nav li { margin: 0 !important; }
    .sidebar-nav > ul > li > ul { margin-left: 14px; border-left: 1px solid var(--line); }

    .sidebar-nav li a {
      display: block;
      padding: 4px 8px !important;
      margin: 1px 0;
      border: none !important;
      border-radius: var(--radius-sm) !important;
      color: var(--text-2) !important;
      font-size: 13px !important;
      font-weight: 450;
      line-height: 1.45 !important;
      transition: background .1s ease, color .1s ease !important;
    }
    .sidebar-nav li a:hover {
      background: var(--hover) !important;
      color: var(--text) !important;
    }
    .sidebar-nav li.active > a,
    .sidebar-nav li a.active {
      background: var(--sel-strong) !important;
      color: var(--text) !important;
      font-weight: 550 !important;
    }
    .sidebar-nav li.collapse > a::after,
    .sidebar-nav li.open > a::after { display: none !important; }

    /* Group headings in the outline */
    .sidebar-nav > ul > li > strong,
    .sidebar-nav > ul > li > p {
      display: block;
      padding: 10px 8px 3px !important;
      margin: 0 !important;
      font-size: 11px !important;
      font-weight: 600 !important;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--faint) !important;
    }

    /* Footer */
    .cyv-foot {
      flex: none;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px 2px;
      border-top: 1px solid var(--line);
      margin-top: 6px;
      font-size: 11.5px;
      color: var(--muted);
    }
    .cyv-foot a { color: var(--muted); text-decoration: none; }
    .cyv-foot a:hover { color: var(--text); text-decoration: underline; }

    /* ══════════════════════════════════════════════════════════════
       Content pane
       ══════════════════════════════════════════════════════════════ */
    .content {
      background: var(--bg) !important;
      top: 0 !important;
      padding-top: 0 !important;
    }
    .content, .markdown-section { color: var(--text); }

    .markdown-section {
      max-width: 780px !important;
      padding: 40px 48px 80px !important;
      line-height: 1.72 !important;
      background: transparent !important;
    }

    .markdown-section p, .markdown-section li, .markdown-section td, .markdown-section th {
      font-size: 15px;
      color: var(--text-2);
    }
    .markdown-section p { margin: 0 0 15px; }
    .markdown-section strong { color: var(--text); font-weight: 620; }
    .markdown-section em { color: var(--text-2); }

    /* Links — plain system blue, underline only on hover */
    .markdown-section a {
      color: var(--link);
      text-decoration: none;
      font-weight: inherit;
      border-bottom: none !important;
    }
    .markdown-section a:hover { text-decoration: underline; text-underline-offset: 2px; }

    /* Headings — SF Pro Display-ish, tight tracking */
    .markdown-section h1, .markdown-section h2, .markdown-section h3,
    .markdown-section h4, .markdown-section h5, .markdown-section h6 {
      color: var(--text);
      font-weight: 660;
      letter-spacing: -0.022em;
      line-height: 1.25;
      margin: 34px 0 12px;
      scroll-margin-top: 24px;
    }
    .markdown-section h1 {
      font-size: 30px;
      font-weight: 700;
      margin-top: 0;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }
    .markdown-section h2 { font-size: 21px; margin-top: 42px; }
    .markdown-section h3 { font-size: 17px; }
    .markdown-section h4 { font-size: 15px; }
    .markdown-section h2 + p, .markdown-section h3 + p { margin-top: 8px; }

    .markdown-section hr {
      height: 1px;
      border: none;
      background: var(--line);
      margin: 32px 0;
    }

    .markdown-section ul, .markdown-section ol { padding-left: 24px; margin: 0 0 15px; }
    .markdown-section li { margin: 4px 0; }
    .markdown-section li::marker { color: var(--muted); }

    /* Lists inside tables / tight lists */
    .markdown-section ul li + ul li { font-size: 14px; }

    /* Blockquote */
    .markdown-section blockquote {
      margin: 18px 0;
      padding: 11px 15px;
      border-left: 3px solid var(--line-strong);
      border-radius: var(--radius-sm);
      background: var(--panel);
      color: var(--muted);
    }
    .markdown-section blockquote p { margin: 0; font-size: 14.5px; color: var(--muted); }

    /* ══════════════════════════════════════════════════════════════
       Cover — a plain app header, not a poster
       ══════════════════════════════════════════════════════════════ */
    section.cover {
      display: block !important;
      padding: 44px 0 8px !important;
      border-bottom: 1px solid var(--line) !important;
      margin-bottom: 30px !important;
      text-align: left !important;
    }
    section.cover .cover-main { max-width: 780px; margin: 0; }
    section.cover h1 {
      font-size: 34px !important;
      font-weight: 700 !important;
      letter-spacing: -0.03em !important;
      color: var(--text) !important;
      border: none !important;
      margin: 0 0 6px !important;
      padding: 0 !important;
    }
    section.cover h1 .cover-main, section.cover h1 img, section.cover h1 span { display: none; }
    section.cover h1 { display: block !important; }
    section.cover .hero-scroll { display: none; }
    section.cover > blockquote, section.cover blockquote {
      margin: 0 0 14px !important;
      padding: 0 !important;
      border: none !important;
      background: none !important;
    }
    section.cover blockquote p {
      display: block !important;
      font-size: 16px !important;
      font-weight: 420;
      color: var(--muted) !important;
      line-height: 1.55 !important;
      max-width: 620px;
      margin: 0 !important;
    }
    section.cover ul {
      display: flex !important;
      flex-wrap: wrap;
      gap: 6px !important;
      margin: 0 0 18px !important;
      padding: 0 !important;
      list-style: none !important;
    }
    section.cover ul li {
      display: inline-block;
      padding: 3px 10px;
      border: 1px solid var(--line-strong);
      border-radius: 99px;
      background: var(--panel);
      color: var(--text-2);
      font-size: 12px;
      font-weight: 500;
      box-shadow: var(--btn-shadow);
    }
    section.cover ul li a {
      display: inline-block;
      padding: 0;
      border: none !important;
      border-radius: 0 !important;
      background: none !important;
      color: var(--text-2) !important;
      font-size: 12px !important;
      font-weight: 500;
      box-shadow: none;
      text-decoration: none !important;
    }
    section.cover ul li a:hover { color: var(--text) !important; }
    section.cover .buttons { margin: 0 !important; }
    section.cover .buttons a, section.cover p:not(:last-child) a, section.cover a:not([href^="#/"]) {
      display: inline-block;
      padding: 6px 14px;
      margin: 0 6px 0 0;
      border: 1px solid var(--line-strong) !important;
      border-radius: var(--radius-sm) !important;
      background: var(--panel-2) !important;
      color: var(--text) !important;
      font-size: 13px !important;
      font-weight: 520;
      box-shadow: var(--btn-shadow);
      text-decoration: none !important;
      opacity: 1 !important;
    }
    section.cover .buttons a:first-child {
      background: var(--accent-fill) !important;
      border-color: var(--accent-fill) !important;
      color: var(--on-accent) !important;
    }
    section.cover .buttons a:hover, section.cover a:hover { opacity: 1 !important; }
    .cover-main > p { color: var(--muted); }

    /* Cover body copy: code listing and spec table inherit the pane styles */
    section.cover pre {
      background: var(--code-bg) !important;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      margin: 20px 0;
      padding: 0;
      position: relative;
      overflow: hidden;
    }
    section.cover pre > code {
      display: block;
      background: transparent;
      color: var(--syn-txt);
      padding: 14px 16px;
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.62;
      overflow-x: auto;
      white-space: pre;
    }
    section.cover pre::after { display: none; }
    section.cover table {
      display: table !important;
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      margin: 20px 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      overflow: hidden;
    }
    section.cover thead { display: none; }
    section.cover td {
      padding: 9px 14px;
      border-bottom: 1px solid var(--line);
      color: var(--text-2);
      font-size: 14px;
      vertical-align: top;
    }
    section.cover tr:first-child td { border-top: none; }
    section.cover td:first-child {
      width: 1%;
      white-space: nowrap;
      color: var(--muted);
      font-weight: 560;
      background: var(--code-bar);
    }
    section.cover tr:last-child td { border-bottom: none; }
    section.cover code {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-xs);
      padding: 1.5px 5px;
      font-family: var(--mono);
      font-size: .855em;
      color: var(--text);
    }

    /* ══════════════════════════════════════════════════════════════
       Code — a code-listing view, not a terminal neon box
       ══════════════════════════════════════════════════════════════ */
    .markdown-section code {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: var(--radius-xs);
      padding: 1.5px 5px;
      font-family: var(--mono);
      font-size: .855em;
      font-weight: 400;
    }
    .markdown-section pre {
      background: var(--code-bg) !important;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      margin: 18px 0;
      padding: 0 !important;
      overflow: hidden;
    }
    .markdown-section pre > code {
      display: block;
      background: transparent !important;
      border: none;
      color: var(--syn-txt) !important;
      padding: 14px 16px !important;
      font-family: var(--mono) !important;
      font-size: 13px !important;
      line-height: 1.62 !important;
      overflow-x: auto;
      white-space: pre;
      text-shadow: none !important;
    }
    .markdown-section pre::after { display: none !important; }

    /* prism token recolour (docsify default classes) */
    .token.comment, .token.prolog, .token.doctype, .token.cdata { color: var(--syn-com); }
    .token.punctuation { color: var(--syn-pun); }
    .token.keyword, .token.boolean, .token.control, .token.directive,
    .token.unit { color: var(--syn-kw); }
    .token.string, .token.attr-value, .token.regex, .token.value, .token.url { color: var(--syn-str); }
    .token.number, .token.angle { color: var(--syn-num); }
    .token.function, .token.function-variable { color: var(--syn-fn); }
    .token.class-name, .token.maybe-class-name, .token.builtin { color: var(--syn-cls); }
    .token.property, .token.property-access, .token.attr-name, .token.variable { color: var(--syn-prop); }
    .token.operator, .token.entity, .token.rule { color: var(--syn-op); }
    .token.tag, .token.selector { color: var(--syn-tag); }
    .token.important, .token.bold { font-weight: 600; }
    .token.italic { font-style: italic; }

    /* copy-to-clipboard — a quiet button in the corner */
    .docsify-copy-code-button {
      position: absolute !important;
      top: 7px !important; right: 8px !important;
      z-index: 2;
      padding: 3px 9px !important;
      border: 1px solid var(--line-strong) !important;
      border-radius: var(--radius-xs) !important;
      background: var(--panel-2) !important;
      color: var(--muted) !important;
      font: 500 11px/1.5 var(--sans) !important;
      letter-spacing: 0 !important;
      text-transform: none !important;
      box-shadow: var(--btn-shadow) !important;
      opacity: 1 !important;
    }
    .docsify-copy-code-button span { font-size: 11px !important; }
    .docsify-copy-code-button:hover { color: var(--text) !important; }
    .docsify-copy-code-button:active { transform: translateY(1px); }

    .markdown-section pre { position: relative; }

    /* ══════════════════════════════════════════════════════════════
       Tables — a plain source-view table
       ══════════════════════════════════════════════════════════════ */
    .markdown-section table {
      display: table !important;
      width: 100% !important;
      border-collapse: separate;
      border-spacing: 0;
      margin: 20px 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      overflow: hidden;
      font-size: 14px;
    }
    .markdown-section thead { background: var(--code-bar); }
    .markdown-section th {
      text-align: left;
      font-weight: 600;
      color: var(--text);
      padding: 9px 14px !important;
      border-bottom: 1px solid var(--line-strong) !important;
    }
    .markdown-section td {
      padding: 9px 14px !important;
      border-bottom: 1px solid var(--line) !important;
      color: var(--text-2);
    }
    .markdown-section tr:last-child td { border-bottom: none !important; }
    .markdown-section tbody tr:hover { background: var(--hover); }
    .markdown-section table code { font-size: .84em; }

    /* ══════════════════════════════════════════════════════════════
       Images / alerts / pagination
       ══════════════════════════════════════════════════════════════ */
    .markdown-section img {
      max-width: 100%;
      border-radius: var(--radius);
      border: 1px solid var(--line);
    }
    .markdown-section img.emoji { width: 1.1em; border: none; border-radius: 0; vertical-align: -.15em; }

    .markdown-section .tip, .markdown-section .warn,
    .markdown-section .important, .markdown-section .caution,
    .markdown-section .note {
      border: none !important;
      border-left: 3px solid var(--line-strong) !important;
      border-radius: var(--radius-sm) !important;
      background: var(--panel) !important;
      color: var(--text-2) !important;
      padding: 11px 14px !important;
      margin: 18px 0 !important;
    }
    .markdown-section .tip { border-left-color: var(--accent-fill) !important; }
    .markdown-section .warn, .markdown-section .important { border-left-color: #b08a3e !important; }
    .markdown-section .caution { border-left-color: #b0564f !important; }

    .page-toc { display: none; }

    .docsify-pagination-container {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin: 46px 0 0;
      padding: 18px 0 0;
      border-top: 1px solid var(--line);
    }
    .docsify-pagination-container .pagination-item-title {
      color: var(--text) !important;
      font-size: 14px !important;
      font-weight: 550 !important;
    }
    .docsify-pagination-container .pagination-item-label {
      color: var(--faint) !important;
      font-size: 11px !important;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .docsify-pagination-container .pagination-item-divider {
      background: var(--line-strong) !important;
      height: 1px !important;
    }
    .docsify-pagination-container .pagination-item:hover .pagination-item-title {
      text-decoration: none;
      color: var(--accent) !important;
    }

    /* Docsify's search plugin renders a .search wrapper — neutralise its
       own positioning so the field sits inside the native search holder. */
    .cyv-search .search { position: static !important; margin: 0 !important; padding: 0 !important; }
    .cyv-search .input-wrap { position: static !important; }
    .cyv-search .clear-button {
      position: absolute !important;
      right: 5px !important; top: 50% !important;
      transform: translateY(-50%) !important;
      width: 16px; height: 16px;
      display: grid; place-items: center;
      border-radius: 50%;
      background: var(--faint);
      color: var(--field);
      font-size: 11px !important;
      line-height: 1 !important;
    }
    .cyv-search .clear-button.show { display: grid !important; }
    .cyv-search .clear-button svg { display: none; }
    .cyv-search .clear-button::before { content: "✕"; font-size: 9px; }

    /* Sidebar owns its own scroll; the chrome stays put */
    .sidebar { overflow: hidden !important; }
    .search { position: static !important; }

    /* Results list under the field */
    .search-result { margin-top: 6px !important; }
    .search-result li {
      border-bottom: 1px solid var(--line) !important;
      padding: 0 !important;
    }
    .search-result-list { margin: 0 !important; padding: 0 !important; }
    .search-result-list a {
      display: block;
      padding: 6px 8px !important;
      color: var(--text-2) !important;
      font-size: 12.5px !important;
    }
    .search-result-list a:hover { background: var(--hover) !important; }
    .search-result-list a .search-keyword {
      background: var(--accent-dim) !important;
      color: var(--accent) !important;
      border-radius: 3px;
      padding: 0 1px;
    }
    .search .no-results {
      padding: 6px 8px !important;
      color: var(--faint) !important;
      font-size: 12.5px !important;
      background: transparent !important;
    }

    /* ══════════════════════════════════════════════════════════════
       Appearance control — NSSegmentedControl
       ══════════════════════════════════════════════════════════════ */
    .cyv-seg {
      display: inline-flex;
      padding: 2px;
      gap: 2px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: var(--field);
      box-shadow: var(--inset-shadow);
    }
    .cyv-seg button {
      appearance: none;
      border: none;
      background: transparent;
      border-radius: 5px;
      padding: 2px 9px;
      color: var(--muted);
      font: 500 11.5px/1.6 var(--sans);
      cursor: default;
      transition: background .12s ease, color .12s ease, box-shadow .12s ease;
    }
    .cyv-seg button:hover { color: var(--text); }
    .cyv-seg button[aria-pressed="true"] {
      background: var(--panel-2);
      color: var(--text);
      box-shadow: var(--btn-shadow);
    }
    .cyv-foot .spacer { flex: 1 1 auto; }

    /* Boot placeholder shown before Docsify mounts */
    .cyv-boot { display: grid; place-items: center; min-height: 100vh; }
    .cyv-boot-box { text-align: center; color: var(--muted); font-size: 13px; }
    .cyv-dots { display: inline-flex; gap: 6px; margin-bottom: 10px; }
    .cyv-dots i {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--line-strong);
      animation: cyv-pulse 1.1s ease-in-out infinite;
    }
    .cyv-dots i:nth-child(2) { animation-delay: .16s; }
    .cyv-dots i:nth-child(3) { animation-delay: .32s; }
    @keyframes cyv-pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }

    /* ══════════════════════════════════════════════════════════════
       Responsive — sidebar becomes a sheet, as on a narrow window
       ══════════════════════════════════════════════════════════════ */
    @media screen and (max-width: 768px) {
      .markdown-section { padding: 26px 20px 64px !important; }
      .markdown-section h1 { font-size: 25px; }
      .markdown-section h2 { font-size: 19px; }
      section.cover { padding: 26px 0 6px !important; }
      section.cover h1 { font-size: 27px !important; }
      .app-nav { margin: 10px 12px 0 0 !important; }
      .app-nav li a { padding: 4px 8px !important; font-size: 12.5px !important; }
      .markdown-section table { display: block !important; overflow-x: auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }

    @media print {
      .sidebar, .app-nav, .to-top, .scroll-progress,
      .docsify-copy-code-button, .docsify-pagination-container { display: none !important; }
      .content { left: 0 !important; top: 0 !important; }
      .markdown-section { max-width: none !important; padding: 0 !important; }
      html, body { background: #fff !important; color: #000 !important; }
      .markdown-section h1, .markdown-section h2, .markdown-section h3 { color: #000 !important; }
      .markdown-section pre, .markdown-section code, .markdown-section table {
        background: #fff !important;
        border-color: #ccc !important;
        color: #000 !important;
      }
    }

  </style>
</head>
<body>
  <div class="scroll-progress" id="scrollProgress"></div>

  <div id="app">
    <div class="cyv-boot">
      <div class="cyv-boot-box">
        <span class="cyv-dots"><i></i><i></i><i></i></span>
        <p>Loading CYVUI documentation…</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-lua.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>

  <script>
    window.$docsify = {
      name: 'CYVUI',
      repo: false,
      loadSidebar: true,
      loadNavbar: true,
      coverpage: true,
      onlyCover: false,
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
      subMaxLevel: 2,
      auto2top: true,
      maxLevel: 3,
      themeColor: '#2f6ba1',
      search: {
        depth: 3,

        placeholder: 'Search docs',

      },

        nextText: 'Next',

      },

      zoom: { background: 'rgba(0,0,0,.72)' },
      plugins: []

  </script>
  <script>
    /* Native chrome: injects the window titlebar, the appearance control and
       the back-to-top button around the markup Docsify generates, then keeps
       light/dark appearance in sync with the OS. */
    (function () {
      var KEY = 'cyvui-appearance';
      var root = document.documentElement;
      var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;

      function stored() {

        } catch (e) { return 'system'; }

      function apply() {
        var light = mode === 'light' || (mode === 'system' && mq && mq.matches);
        root.setAttribute('data-theme', light ? 'light' : 'dark');
        root.setAttribute('data-appearance', mode);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', light ? '#ffffff' : '#1c1c1e');
        Array.prototype.forEach.call(document.querySelectorAll('.cyv-seg button'), function (b) {
          b.setAttribute('aria-pressed', String(b.getAttribute('data-mode') === mode));
        });
      }

      function buildSidebar() {
        var side = document.querySelector('.sidebar');
        var nav = document.querySelector('.sidebar-nav');
        if (!side || !nav || side.querySelector('.cyv-side')) return;

        var wrap = document.createElement('div');
        wrap.className = 'cyv-side';

        var title = document.createElement('div');
        title.className = 'cyv-title';
        title.innerHTML =
          '<span class="win-dots"><i></i><i></i><i></i></span>' +
          '<span class="name">CYVUI<small>Documentation</small></span>';

        var search = document.createElement('div');
        search.className = 'cyv-search';

        var label = document.createElement('div');
        label.className = 'cyv-section';
        label.textContent = 'Contents';

        var foot = document.createElement('div');
        foot.className = 'cyv-foot';
        foot.innerHTML =
          '<span class="spacer"></span>' +
          '<span class="cyv-seg" role="group" aria-label="Appearance">' +
            '<button type="button" data-mode="light">Light</button>' +
            '<button type="button" data-mode="dark">Dark</button>' +
            '<button type="button" data-mode="system">Auto</button>' +
          '</span>';

        Array.prototype.forEach.call(foot.querySelectorAll('.cyv-seg button'), function (b) {
          b.addEventListener('click', function () {
            mode = b.getAttribute('data-mode');
            try { localStorage.setItem(KEY, mode); } catch (e) { /* private mode */ }
            apply();
          });
        });

        wrap.appendChild(title);
        wrap.appendChild(search);
        wrap.appendChild(label);
        wrap.appendChild(nav);
        wrap.appendChild(foot);
        side.appendChild(wrap);

        // Docsify renders its search box as a sibling — pull it into the field.
        var box = side.querySelector('.search, .sidebar .search');
        if (box && box.parentNode === side) search.appendChild(box);

        apply();
      }
      function buildToTop() {
        if (document.querySelector('.to-top')) return;
        var btn = document.createElement('button');
        btn.className = 'to-top';
        btn.type = 'button';
        btn.setAttribute('aria-label', 'Back to top');
        btn.innerHTML =
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" ' +
          'stroke="currentColor" stroke-width="2.2" stroke-linecap="round" ' +
          'stroke-linejoin="round"><path d="M12 19V6M5 12l7-7 7 7"/></svg>';
        btn.addEventListener('click', function () {
          var sc = document.querySelector('.content');
          if (sc) sc.scrollTop = 0; else window.scrollTo(0, 0);
        });
        document.body.appendChild(btn);
      }

      function trackScroll() {
        var bar = document.getElementById('scrollProgress');
        function update() {
          var sc = document.querySelector('.content') || document.scrollingElement;
          if (!sc) return;
          var max = sc.scrollHeight - sc.clientHeight;
          var p = max > 4 ? sc.scrollTop / max : 0;
          if (bar) bar.style.width = (p * 100).toFixed(2) + '%';
          var top = document.querySelector('.to-top');
          if (top) top.classList.toggle('show', sc.scrollTop > 420);
        }
        window.addEventListener('scroll', update, true);
        window.addEventListener('resize', update);
        update();
      }

      if (mq && mq.addEventListener) mq.addEventListener('change', apply);
      else if (mq && mq.addListener) mq.addListener(apply);

      window.$docsify.plugins.push(function (hook) {
        hook.ready(function () {
          buildSidebar();
          buildToTop();
          trackScroll();
          // Docsify mounts the search box a tick after ready — adopt it then.
          setTimeout(function () {
            var side = document.querySelector('.sidebar');
            var holder = document.querySelector('.cyv-search');
            var box = side && side.querySelector('.search');
            if (box && holder && box.parentNode !== holder) holder.appendChild(box);
            apply();
          }, 0);
        });
        hook.doneEach(function () {
          buildSidebar();
          apply();
        });
      });

      apply();
    })();
  </script>
</body>
</html>
